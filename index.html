        <h1>Kasia Walter — Frontend &amp; Motion Engineer</h1>

        <section aria-label="About">
          <h2>About</h2>
          <p>Frontend and motion engineer. I build the layer you feel before you read a word.</p>
          <p>I write the engines — WebGL, shaders, scroll choreography — and the React systems under them that hold when the product gets real.</p>
          <p>I direct AI agents the way I direct motion: explore wide, cut hard, keep authorship. The methodology is mine — I wrote it, and I review every diff.</p>
          <p>Four years of production web — two in GSAP motion, two in React and Next. Awwwards Developer Award, 2024. For the build. Now at Pirxey / Widelab: frontend, AI engineering, design systems in code.</p>
        </section>

        <section aria-label="Craft">
          <h2>Frontend as medium, tuned across five bands</h2>
          <ul>
            <li><strong>Motion</strong> — I write the engine, not the tween. Shaders, particle systems, and scroll choreography, timed so the page has a pulse. (awwwards developer award '24 · webgl · glsl · gsap)</li>
            <li><strong>Interface</strong> — React and TypeScript systems that survive real product pressure. Design systems in code: tokens, component APIs, and the discipline that keeps them from rotting. (react · typescript · next · design systems)</li>
            <li><strong>Interaction</strong> — the micro-signals: easing, state, feedback. What tells you the machine heard you. (gesture · easing · state · polish)</li>
            <li><strong>Repair</strong> — I find what feels wrong before anyone can name it, then fix the structure underneath instead of the symptom. (perf budgets · gpu tiers · frame time)</li>
            <li><strong>Direction</strong> — I run AI agents with persistent memory and review every diff. The design-direction methodology I use is one I wrote myself. (design direction · agent skills · judgement)</li>
          </ul>
        </section>

        <section aria-label="Work">
          <h2>Work</h2>
          <p>
            <a href="https://www.cuewigs.com">cuewigs</a> — I wrote the frontend. The design and the motion spec came from the designer; the GSAP implementation, the responsive system, and the performance are mine. The layout scales as one continuous system: everything in rem, the root font-size interpolated against the viewport. Awwwards Developer Award, February 2024 — Awwwards gives that one to the developer. Site of the Day the same month.
          </p>
          <p>This site — a WebGL engine written from scratch: a shaded core lit off-axis, tendrils, a sonar pulse, comets, and a charge mechanic that locks the chamber. Three.js and my own shaders. It stays smooth on a mid-range phone: GPU tiering, bloom dropped where it costs too much, native-resolution rendering, a frame budget every effect has to pay into. Built by directing AI agents with persistent memory — every diff reviewed by me.</p>
          <p>Also: React and Next.js product apps. Design systems built in code from a designer's visual language — the token architecture and component API underneath.</p>
        </section>
