<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kasia Walter — Frontend &amp; Motion Engineer</title>
    <meta
      name="description"
      content="Kasia Walter — frontend & motion engineer. Interfaces that carry feeling: motion, structure, and problem-solving with React, TypeScript, and WebGL. Awwwards-recognised."
    />
    <meta name="author" content="Kasia Walter" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph / social + agent preview. TODO(deploy): add /og-cover.png
         (1200×630) and set og:url + canonical to the real domain. -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Kasia Walter — Frontend & Motion Engineer" />
    <meta
      property="og:description"
      content="Interfaces that carry feeling: motion, structure, and problem-solving with React, TypeScript, and WebGL. Awwwards-recognised."
    />
    <meta property="og:image" content="/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kasia Walter — Frontend & Motion Engineer" />
    <meta
      name="twitter:description"
      content="Interfaces that carry feeling: motion, structure, and problem-solving with React, TypeScript, and WebGL."
    />
    <meta name="twitter:image" content="/og-cover.png" />

    <!-- Structured identity for search + AI agents. Carries the CONCRETE facts
         (role, skills, award, contact) that the visual layer keeps poetic.
         TODO(confirm): jobTitle wording, worksFor, add `url` on deploy. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "mainEntity": {
          "@type": "Person",
          "name": "Kasia Walter",
          "jobTitle": "Frontend & Motion Engineer",
          "description": "I build interfaces that carry feeling. My work sits where motion, structure, and problem-solving meet — using frontend to shape products that feel clearer, calmer, and more alive. AI is part of the process, not the point: a tool for exploring, structuring, and shipping, while judgement stays with me.",
          "email": "mailto:bronowickakasia@gmail.com",
          "knowsAbout": [
            "Frontend engineering",
            "Motion design",
            "WebGL",
            "GLSL",
            "Scroll choreography",
            "React",
            "TypeScript",
            "Design systems",
            "Interaction design",
            "AI-assisted workflows"
          ],
          "sameAs": ["https://www.linkedin.com/in/kasiawalter"],
          "award": "Awwwards Developer Award & Site of the Day — cuewigs, 2024",
          "worksFor": {
            "@type": "Organization",
            "name": "Pirxey / Widelab"
          }
        }
      }
    </script>

    <!-- Self-hosted fonts (latin subsets, ~28kB total) — no third-party
         critical path. @font-face lives in src/index.css; preloading both
         files removes the FOUT window on the giant "motion" word and the
         monospace UI text. -->
    <link rel="preload" href="/fonts/boldonse-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/syne-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body style="background:#000000">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
