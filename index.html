        <h1>Kasia Walter — Frontend &amp; Motion Engineer</h1>

        <section aria-label="About">
          <h2>About</h2>
          <p>Frontend and motion engineer. I build the layer you feel before you read a word.</p>
          <p>Something is wrong and nobody can name it yet. That is the moment I am for — I go under the surface and fix the structure, not the symptom.</p>
          <p>AI moved the bottleneck from typing to judgement. Judgement is the part I am good at.</p>
          <p>Four years of production web, all of it at Pirxey / Widelab. Web developer first — motion-led sites in GSAP. React developer since 2024 — product apps and design systems in code.</p>
        </section>

        <section aria-label="Craft">
          <h2>Frontend as medium, tuned across five bands</h2>
          <ul>
            <li><strong>Interface</strong> — React and TypeScript product apps: typed forms and validation, client and server state, components documented so the next person can use them. Design systems in code — tokens and component APIs. (react · typescript · next · rtk query · zod · storybook)</li>
            <li><strong>Motion</strong> — I write the engine, not the tween. Shaders, particle systems, and scroll choreography — and the render loop they have to share with the app. (awwwards developer award '24 · webgl · glsl · gsap)</li>
            <li><strong>Repair</strong> — I find what feels wrong before anyone can name it, then fix the structure underneath instead of the symptom. Frame budgets, GPU tiers, layout read once a frame. (perf budgets · gpu tiers · frame time)</li>
            <li><strong>Interaction</strong> — the micro-signals: easing, state, feedback. What tells you the machine heard you. (gesture · easing · state · polish)</li>
            <li><strong>Direction</strong> — I run AI agents with persistent memory, against a method I wrote myself, and I built the review they answer to. What ships is my call. (design direction · agent skills · judgement)</li>
          </ul>
        </section>

        <section aria-label="Work">
          <h2>Work</h2>
          <p>
            <a href="https://www.cuewigs.com">cuewigs</a> — I wrote the frontend. The design and the motion spec came from the designer; the GSAP implementation, the responsive system, and the performance are mine. The layout scales as one continuous system: everything in rem, the root font-size interpolated against the viewport. Awwwards Developer Award, February 2024 — Awwwards gives that one to the developer. Site of the Day the same month.
          </p>
          <p>This site — a real-time engine sharing a render loop with a React app: Three.js and my own GLSL, written from scratch in TypeScript. It holds on a mid-range phone because I made it hold: the GPU is tiered and effects are dropped by cost, scroll work is rAF-coalesced, and layout is read once a frame. Reduced motion switches the engine off and the page still reads. Built by directing AI agents with persistent memory — against a method and a review I wrote myself.</p>
        </section>

          <p>Looking for a team where motion is engineering, not decoration.</p>
          <p>Open to frontend and motion engineering roles. EU remote, based in Poland.</p>
