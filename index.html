        <h1>Kasia Walter — Frontend &amp; Motion Engineer</h1>

        <section aria-label="About">
          <h2>About</h2>
          <p>I build interfaces that carry feeling.</p>
          <p>My work sits where motion, structure, and problem-solving meet — using frontend to shape products that feel clearer, calmer, and more alive.</p>
          <p>AI is part of the process, not the point: a tool for exploring, structuring, and shipping, while judgement stays with me.</p>
          <p>Building for the web since 2022: two years of motion-led sites (Webflow, GSAP), two of React and Next.js product apps. Currently at Pirxey / Widelab, working across frontend, interface quality, product UI, and design systems.</p>
        </section>

        <section aria-label="Craft">
          <h2>Frontend as medium, tuned across five bands</h2>
          <ul>
            <li><strong>Motion</strong> — animation used as meaning: pacing, tension, feedback, and release. (gsap · lenis · webgl · scroll choreography)</li>
            <li><strong>Interface</strong> — React systems that stay clear under real product constraints. (react · typescript · design systems)</li>
            <li><strong>Interaction</strong> — micro-signals that reduce friction and make intent legible. (gesture · easing · states · polish)</li>
            <li><strong>Repair</strong> — finding what feels off, then tightening flow, structure, and experience. (debugging · refinement · UX friction)</li>
            <li><strong>Direction</strong> — using AI agents without giving away authorship, taste, or the final call. (claude code · agent workflows · judgement)</li>
          </ul>
        </section>

        <section aria-label="Work">
          <h2>Work</h2>
          <p>
            <a href="https://www.cuewigs.com">cuewigs</a> — a motion-led marketing site; frontend and GSAP scroll choreography built by Kasia, on a fully fluid vw/vh layout that holds at every resolution. Awwwards Developer Award and Site of the Day, February 2024.
          </p>
          <p>Also shipped: React and Next.js product apps, design system work for product teams, a run of Webflow and WordPress builds, and HTML email templates.</p>
          <p>AI practice: writes her own agent skills — including a design-direction skill — and runs agents with persistent memory across sessions. This site was built that way.</p>
        </section>
